services:
  vless:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vless-bun
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - UUID=${UUID}
      - PROXYIP=${PROXYIP:-}
      - PORT=3000
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
