services:
  vless:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vless-bun
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - UUID=${UUID}
      - PROXYIP=${PROXYIP:-}
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
